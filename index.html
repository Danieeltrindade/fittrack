<script>try{var a=JSON.parse(localStorage.getItem("fittrack_prefs"));if(a){if(/^[a-z]+$/.test(a.theme))document.documentElement.dataset.theme=a.theme;if(/^[a-z]+$/.test(a.accent))document.documentElement.dataset.accent=a.accent}}catch(e){}</script>
